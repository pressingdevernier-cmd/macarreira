<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Macarreira">
  <!-- Favicon vectoriel, repris du dessin de outils/icones.html : creme du
       recueil, double filet de cartonnage, initiale M.
       Les navigateurs n'ayant pas Playfair Display installee, on retombe ici
       sur une serif du systeme ; a la taille d'un onglet, la difference ne
       se voit pas. Les vraies icones, en Playfair, sont les PNG a cote. -->
  <rect width="512" height="512" fill="#f4ecda"/>
  <rect x="44" y="44" width="424" height="424" rx="8" fill="none" stroke="#d8c9a8" stroke-width="5"/>
  <rect x="60" y="60" width="392" height="392" rx="4" fill="none" stroke="#a3492c" stroke-width="2"/>
  <text x="256" y="340" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="268" font-weight="700" fill="#a3492c">M</text>
</svg>
