<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macarreira</title>
<meta name="description" content="Le songbook du duo : paroles, accords et partitions.">
<!-- Couleur de la barre du navigateur sur téléphone, une par thème -->
<meta name="theme-color" content="#f4ecda" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<!-- L'iPhone n'accepte pas les icones SVG : il lui faut un PNG opaque. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macarreira">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="recueil.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">
      <span class="brand-title">Macarreira</span>
      <span class="brand-sub">Guitare · Piano · Deux voix</span>
    </a>
    <nav class="nav-haut">
      <a href="#/catalogue">Catalogue</a>
      <a class="nav-lien" href="#/accords">Accords</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Changer de thème">
        <span id="theme-icon" aria-hidden="true">☾</span>
      </button>
    </nav>
  </div>
</header>

<!-- Toute l'application s'affiche ici, remplacée par app.js selon l'adresse
     (#/ , #/song/xxx ou #/accords) -->
<main id="view" class="wrap" tabindex="-1"></main>

<footer class="site-footer wrap">
  <p>Notre recueil · <span id="song-count"></span>
     · <a class="lien-reglages" href="#/reglages">Réglages</a>
     <span id="app-version"></span></p>
</footer>

<!-- Bibliothèques téléchargées une fois et rangées dans lib/ (aucun appel à Internet) :
     ChordSheetJS lit et transpose les accords ; chords.js dessine les diagrammes
     à partir des bases guitar.json et ukulele.json. -->
<script src="lib/chordsheetjs.bundle.js"></script>
<script src="chords.js"></script>
<script src="depot.js"></script>
<script src="config.js"></script>
<script src="carnet.js"></script>
<script src="catalogue.js"></script>
<script src="synchro.js"></script>
<script src="recueil.js"></script>
<script src="app.js"></script>
</body>
</html>
